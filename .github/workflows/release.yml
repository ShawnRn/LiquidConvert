name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选：覆盖项目内版本号"
        required: false
        type: string
      update_appcast:
        description: "若已配置 Sparkle 私钥，则一并更新 appcast.xml"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-27
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HAS_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Finding all installed Xcode applications..."
          candidates=()
          while IFS= read -r app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              version=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | awk '/Xcode/ {print $2}')
              candidates+=("$version|$app")
            fi
          done < <(find /Applications -maxdepth 1 -name 'Xcode*.app')

          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "ERROR: No Xcode installation found in /Applications"
            exit 1
          fi

          # 按照版本号自然排序，选择最新版本
          sorted_candidates=($(for c in "${candidates[@]}"; do echo "$c"; done | sort -V))
          best_candidate="${sorted_candidates[-1]}"
          best_version="${best_candidate%%|*}"
          best_path="${best_candidate##*|}"

          echo "==> Installed Xcode versions:"
          for c in "${sorted_candidates[@]}"; do
            echo "  - ${c%%|*} at ${c##*|}"
          done

          echo "==> Selecting the newest Xcode: Version $best_version at $best_path"
          sudo xcode-select -switch "$best_path/Contents/Developer"

          echo "==> Currently active Xcode information:"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers

      - name: Install DMG packager
        shell: bash
        run: npm install -g create-dmg@7.1.0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(xcodebuild -showBuildSettings -project "LiquidConvert.xcodeproj" -scheme "LiquidConvert" -configuration Release 2>/dev/null)
          PROJECT_VERSION=$(echo "$SETTINGS" | awk '/ MARKETING_VERSION = / {print $3; exit}')
          PROJECT_BUILD=$(echo "$SETTINGS" | awk '/ CURRENT_PROJECT_VERSION = / {print $3; exit}')

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag / workflow version ($VERSION) does not match project MARKETING_VERSION ($PROJECT_VERSION)"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$PROJECT_BUILD" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Build release artifacts
        shell: bash
        run: ./scripts/build.sh release

      - name: Verify generated DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          test -f "releases/LiquidConvert_${VERSION}_arm64.dmg"

      - name: Create GitHub Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "LiquidConvert ${VERSION}" \
              --notes "Automated release for LiquidConvert ${VERSION}."
          fi

      - name: Align release metadata to current hotfix commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="LiquidConvert ${VERSION}" \
            -f body="Automated release for LiquidConvert ${VERSION}."

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release upload "$TAG" \
            "releases/LiquidConvert_${VERSION}_arm64.dmg" \
            --clobber

      - name: Update appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Validate appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        shell: bash
        run: xmllint --noout appcast.xml

      - name: Snapshot appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        shell: bash
        run: cp appcast.xml "$RUNNER_TEMP/appcast.xml"

      - name: Commit appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged"
            exit 0
          fi

          git fetch origin "${DEFAULT_BRANCH}"

          LOCAL_APPCAST_SHA=$(shasum -a 256 "$RUNNER_TEMP/appcast.xml" | awk '{print $1}')
          REMOTE_APPCAST_SHA=$(git show "origin/${DEFAULT_BRANCH}:appcast.xml" | shasum -a 256 | awk '{print $1}')

          if [[ "$LOCAL_APPCAST_SHA" == "$REMOTE_APPCAST_SHA" ]]; then
            echo "appcast.xml already updated on origin/${DEFAULT_BRANCH}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- appcast.xml
          git switch -C "release-appcast-${GITHUB_RUN_ID}" "origin/${DEFAULT_BRANCH}"
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml already matches latest ${DEFAULT_BRANCH}"
            exit 0
          fi

          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.version.outputs.tag }}"

          if git push origin "HEAD:${DEFAULT_BRANCH}"; then
            exit 0
          fi

          git fetch origin "${DEFAULT_BRANCH}"
          REMOTE_APPCAST_SHA=$(git show "origin/${DEFAULT_BRANCH}:appcast.xml" | shasum -a 256 | awk '{print $1}')

          if [[ "$LOCAL_APPCAST_SHA" == "$REMOTE_APPCAST_SHA" ]]; then
            echo "appcast.xml reached ${DEFAULT_BRANCH} during concurrent release updates"
            exit 0
          fi

          echo "appcast.xml push still conflicts with newer remote changes"
          exit 1
