name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "可选：覆盖项目内版本号"
        required: false
        type: string
      update_appcast:
        description: "若已配置 Sparkle 私钥，则一并更新 appcast.xml"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HAS_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_XCODE_VERSION="$(xcodebuild -version)"

          if grep -q '^Xcode 26' <<<"$ACTIVE_XCODE_VERSION"; then
            echo "Xcode 26 already active"
          else
            while IFS= read -r candidate; do
              CANDIDATE_VERSION="$(DEVELOPER_DIR="${candidate}/Contents/Developer" xcodebuild -version)"
              grep -q '^Xcode 26' <<<"$CANDIDATE_VERSION" || continue
              sudo xcode-select -switch "${candidate}/Contents/Developer"
              ACTIVE_XCODE_VERSION="$CANDIDATE_VERSION"
              break
            done < <(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V)
          fi

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers

          ACTIVE_XCODE_VERSION="$(xcodebuild -version)"
          if ! grep -q '^Xcode 26' <<<"$ACTIVE_XCODE_VERSION"; then
            echo "Expected Xcode 26 on the release runner, but a different toolchain is active."
            exit 1
          fi

      - name: Install DMG packager
        shell: bash
        run: npm install -g create-dmg@7.1.0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(xcodebuild -showBuildSettings -project "LiquidConvert.xcodeproj" -scheme "LiquidConvert" -configuration Release 2>/dev/null)
          PROJECT_VERSION=$(echo "$SETTINGS" | awk '/ MARKETING_VERSION = / {print $3; exit}')
          PROJECT_BUILD=$(echo "$SETTINGS" | awk '/ CURRENT_PROJECT_VERSION = / {print $3; exit}')

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag / workflow version ($VERSION) does not match project MARKETING_VERSION ($PROJECT_VERSION)"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$PROJECT_BUILD" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Build dual-arch release artifacts
        shell: bash
        run: ./scripts/build.sh release

      - name: Verify generated DMGs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          test -f "releases/LiquidConvert_${VERSION}_arm64.dmg"
          test -f "releases/LiquidConvert_${VERSION}_x86_64.dmg"

      - name: Create GitHub Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "LiquidConvert ${VERSION}" \
              --notes "Automated release for LiquidConvert ${VERSION}."
          fi

      - name: Align release metadata to current hotfix commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="LiquidConvert ${VERSION}" \
            -f body="Automated release for LiquidConvert ${VERSION}."

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release upload "$TAG" \
            "releases/LiquidConvert_${VERSION}_arm64.dmg" \
            "releases/LiquidConvert_${VERSION}_x86_64.dmg" \
            --clobber

      - name: Update appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Validate appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        shell: bash
        run: xmllint --noout appcast.xml

      - name: Commit appcast.xml
        if: ${{ env.HAS_SPARKLE_PRIVATE_KEY == 'true' && (github.event_name == 'push' || inputs.update_appcast) }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
